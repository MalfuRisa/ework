name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish EWork
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          set -euo pipefail
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive --ignore-engines
          yarn build
          test -s dist/index.html
          test -s dist/config.js

      - name: Package frontend and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (
            cd dist
            zip -qr ../release-assets/frontend.zip .
            tar -czf ../release-assets/frontend.tar.gz .
          )
          cp "docs/releases/${GITHUB_REF_NAME}.md" release-assets/RELEASE_NOTES.md
          cd release-assets
          sha256sum frontend.zip frontend.tar.gz RELEASE_NOTES.md > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release-assets/frontend.zip
            release-assets/frontend.tar.gz
            release-assets/RELEASE_NOTES.md
            release-assets/SHA256SUMS.txt
